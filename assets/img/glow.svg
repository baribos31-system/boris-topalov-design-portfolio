<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="presentation">
  <!-- Hemisphere glow ("molten horizon"). CSS builds the live dome with
       radial-gradients + blur; this file is the static fallback / poster
       version for places where a blurred box is too expensive. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="100%" r="72%" fx="50%" fy="100%">
      <stop offset="0%" stop-color="#F16001" stop-opacity="0.95"/>
      <stop offset="26%" stop-color="#F16001" stop-opacity="0.55"/>
      <stop offset="46%" stop-color="#C10801" stop-opacity="0.38"/>
      <stop offset="72%" stop-color="#C10801" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9C3AB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD6B4" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D9C3AB" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <ellipse cx="600" cy="540" rx="600" ry="400" fill="url(#core)" filter="url(#soft)"/>
  <path d="M0 540 C 200 340, 1000 340, 1200 540" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
