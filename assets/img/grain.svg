<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="presentation">
  <!-- Fine film grain tile. Seamless via stitchTiles; greyscale, alpha limited
       so CSS opacity / blend-mode stays in control. 1.1 KB, no rasters. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="1.25" intercept="-0.12"/>
      <feFuncG type="linear" slope="1.25" intercept="-0.12"/>
      <feFuncB type="linear" slope="1.25" intercept="-0.12"/>
      <feFuncA type="linear" slope="0.62" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#grain)"/>
</svg>
